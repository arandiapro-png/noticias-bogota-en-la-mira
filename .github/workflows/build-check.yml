name: Verificar compilación Angular

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar compilación para GitHub Pages
        run: npm run build -- --base-href /noticias-bogota-en-la-mira/
