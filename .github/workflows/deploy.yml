name: Construir y publicar Angular en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Instalar dependencias de Angular
        run: npm install
      - name: Construir la aplicación para GitHub Pages
        run: npm run build -- --base-href /noticias-bogota-en-la-mira/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos publicados
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/noticias-bogota-en-la-mira/browser
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
